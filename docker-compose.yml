networks:
  default:
  cria_shared:
    external: true

services:
    # Cria-Front MailHog
    mailhog:
      platform: linux/amd64
      image: 'docker.io/mailhog/mailhog'
      ports:
        - '127.0.0.1:8025:8025'
        - '127.0.0.1:1025:1025'
    redis:
      image: 'docker.io/redis:latest'
      # volatile-lru only evicts keys that carry a TTL (all Criabot session and
      # cache keys do), so active sessions are protected until they naturally
      # expire even under memory pressure.
      command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy volatile-lru
      ports:
        - '127.0.0.1:6379:6379'
      healthcheck:
        test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
        interval: 5s
        timeout: 5s
        retries: 5
    # Cria-Front MySQL
    mysql:
      image: 'docker.io/mysql:8.4'
      command: [ 'mysqld','--mysql-native-password=ON' ]
      restart: always
      environment:
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        MYSQL_DATABASE: rag_flow
      healthcheck:
        test: mysqladmin ping -h 127.0.0.1 -uroot --password=$$MYSQL_ROOT_PASSWORD
        start_period: 45s
        interval: 5s
        timeout: 5s
        retries: 12
      ports:
        - '127.0.0.1:3306:3306'
      volumes:
        - './mysql_data:/var/lib/mysql:cached'
    # Cria-Front Moodle
    cria:
      platform: linux/amd64
      image: 'uitadmin/cria:v1.1.0'
      ports:
        - '127.0.0.1:80:80'
      volumes:
        - './html/config.php:/var/www/html/config.php:cached'
        - './moodledata:/var/www/moodledata:cached'
        - './log:/var/log/apache2:cached'
        - '../Cria:/var/www/html/local/cria:cached'
      networks:
        - default
        - cria_shared
      depends_on:
        - mysql
        - mailhog
        - redis
    # Cria-Back SearXNG
    searxng:
      image: docker.io/searxng/searxng:2026.4.29-cba0cffa8
      ports:
        - "127.0.0.1:8082:8080"
      environment:
        SEARXNG_BASE_URL: "http://searxng:8080/"
        # Keep SearXNG on its own logical DB so it can't collide with Criabot
        # session/cache keys (which live on DB 0).
        SEARXNG_VALKEY_URL: "redis://:${REDIS_PASSWORD}@redis:6379/1"
        SEARXNG_LIMITER: "false"
      healthcheck:
        test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1" ]
        start_period: 10s
        interval: 10s
        timeout: 5s
        retries: 10
      volumes:
        - ./searxng_data/settings.yml:/etc/searxng/settings.yml:ro
        - ./searxng_data/limiter.toml:/etc/searxng/limiter.toml:ro
    elasticsearch:
      image: docker.io/elasticsearch:8.13.4
      environment:
        discovery.type: single-node
        # Heap size for Elasticsearch.
        # - Current dev/test setting:
        ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        # - For production or heavier loads, replace the line above with one of:
        # ES_JAVA_OPTS: "-Xms1g -Xmx1g"
        # ES_JAVA_OPTS: "-Xms2g -Xmx2g"
        ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
        # Disk watermark settings to handle low disk space
        cluster.routing.allocation.disk.threshold_enabled: "true"
        cluster.routing.allocation.disk.watermark.low: "5gb"
        cluster.routing.allocation.disk.watermark.high: "3gb"
        cluster.routing.allocation.disk.watermark.flood_stage: "2gb"
      ports:
        - "127.0.0.1:9200:9200"
        - "127.0.0.1:9300:9300"
      volumes:
        - ./elasticsearch_data:/usr/share/elasticsearch/data:cached
      healthcheck:
        test:
          [
            "CMD-SHELL",
            # for production its better to set health check to green
            "curl -fsS -u elastic:$$ELASTIC_PASSWORD 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=30s' >/dev/null || exit 1",
          ]
        start_period: 60s
        interval: 10s
        timeout: 35s
        retries: 20
      # For production deployments, you may also want to enable these limits
      # to avoid OS-level constraints under higher load:
      # ulimits:
      #   memlock:
      #     soft: -1
      #     hard: -1
      #   nofile:
      #     soft: 65536
      #     hard: 65536
      
    # Cria-Back Criadex
    criadex:
      image: uitadmin/criadex:latest
      restart: unless-stopped
      mem_limit: 3g
      ports:
        - "127.0.0.1:25574:25574"
      environment:
        ENV_PATH: "./.env"
        APP_INITIAL_MASTER_KEY: ${APP_INITIAL_MASTER_KEY}
        RAGFLOW_API_KEY: ${RAGFLOW_API_KEY}
        RAGFLOW_SECRET_KEY: ${RAGFLOW_SECRET_KEY}
        REDIS_HOST: redis
        REDIS_PORT: 6379
        REDIS_PASSWORD: ${REDIS_PASSWORD}
        REDIS_DB: 2
      volumes:
        - ./criadex_data/docker.env:/home/cria/.env
      networks:
        - default
        - cria_shared
      depends_on:
        mysql:
          condition: service_healthy
        elasticsearch:
          condition: service_healthy
        ragflow:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        test: [ "CMD", "curl", "-f", "http://criadex:25574/health_check" ]
        start_period: 1s
        interval: 5s
        timeout: 5s
        retries: 5
    # Cria-Back Criabot
    criabot:
      image: uitadmin/criabot:latest
      ports:
        - "127.0.0.1:25575:25575"
      environment:
        ENV_PATH: "./.env"
      volumes:
        - ./criabot_data/docker.env:/home/cria/.env
      networks:
        - default
        - cria_shared
      depends_on:
        mysql:
          condition: service_healthy
        redis:
          condition: service_healthy
        criadex:
          condition: service_healthy
        searxng:
          condition: service_healthy
      healthcheck:
        test: [ "CMD", "curl", "-f", "http://criabot:25575/health_check" ]
        start_period: 1s
        interval: 5s
        timeout: 5s
        retries: 5
    # MinIO for Ragflow
    minio:
      image: minio/minio:RELEASE.2025-09-07T16-13-09Z
      command: server /data --console-address ":9001"
      ports:
        - "127.0.0.1:9000:9000"
        - "127.0.0.1:9001:9001"
      volumes:
        - ./minio_data:/data
      environment:
        MINIO_ROOT_USER: ${MINIO_ROOT_USER}
        MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
        interval: 5s
        timeout: 5s
        retries: 5
    # Ragflow
    ragflow:
      image: infiniflow/ragflow:v0.26.2
      platform: linux/amd64
      ports:
        - "127.0.0.1:8080:9380"
        - "127.0.0.1:9381:80"
      env_file:
        - ./ragflow_data/docker.env
      environment:
        RAGFLOW_SERVER_CONF_PATH: "/ragflow/conf/service_conf.yaml"
        ES_HOST: elasticsearch
        ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
        REDIS_PASSWORD: ${REDIS_PASSWORD}
        MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        MINIO_HOST: "minio"
        MINIO_PORT: "9000"
        MINIO_USER: ${MINIO_ROOT_USER}
        MINIO_PASSWORD: ${MINIO_ROOT_PASSWORD}
        MINERU_OUTPUT_DIR: "/ragflow/data/mineru_output"
        STORAGE_IMPL: "MINIO"
        RAGFLOW_API_KEY: ${RAGFLOW_API_KEY} 
      volumes:
        - ./ragflow_data:/ragflow/data
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf
        - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
        - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      networks:
        - default
        - cria_shared
      depends_on:
        mysql:
          condition: service_healthy
        elasticsearch:
          condition: service_healthy
        minio:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        test: [ "CMD", "curl", "-f", "http://ragflow:9380/api/v1/system/healthz" ]
        start_period: 120s
        interval: 10s
        timeout: 10s
        retries: 60
    # Cria-Back Embed API
    criaembed-api:
      image: uitadmin/criaembed-api:latest
      ports:
        - "127.0.0.1:3003:3003"
      environment:
        ENV_PATH: "./.env"
      volumes:
        - ./criaembed-api_data/docker.env:/home/cria/.env
      networks:
        - default
        - cria_shared
      depends_on:
        criabot:
          condition: service_healthy
    # Cria-Back Embed App
    criaembed-app:
      image: uitadmin/criaembed-app:latest
      ports:
        - "127.0.0.1:4000:4000"
      environment:
        ENV_PATH: "./env/docker.env"
      volumes:
        - ./criaembed-app_data:/home/cria/env
      depends_on:
        criabot:
          condition: service_healthy
